[project]
name = "paddleocr-vl-chat"
version = "1.0.0"
description = "PaddleOCR-VL Chat - web UI for the PaddleOCR-VL OCR inference server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "openai==3.59.0",
    "pypdfium2==5.15.2",
    "Pillow==13.0.0",
    "python-multipart==0.0.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
